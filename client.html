<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; touch-action: none; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .box { background: #000d; border: 1px solid #fff; padding: 20px 26px; text-align: center;
    pointer-events: auto; line-height: 1.9; max-width: 90vw; }
  button, input { font: inherit; margin: 4px; padding: 8px 14px; border: 1px solid #fff; }
  button { background: #fff; color: #000; cursor: pointer; }
  input { background: #000; color: #fff; width: 9em; }
  #note { position: fixed; top: 8px; left: 0; right: 0; text-align: center; opacity: .8; }
  .link { user-select: all; opacity: .7; font-size: 12px; word-break: break-all; }
</style>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="note"></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), uiEl = document.getElementById('ui');
const noteEl = document.getElementById('note');
const roomId = location.pathname.startsWith('/r/') ? location.pathname.slice(3) : '';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const V = { W: 800, H: 450, R: 7, PW: 12, PH: 80, AX: 24, BX: 764, SPEED: 700, WIN: 11 };
const BUFFER = 100; // ms of interpolation delay

let ws = null, role = null, chosen = false, buf = [], myY = V.H / 2, tgt = V.H / 2, sentY = null, sentAt = 0;
let lastTgt = null, tgtAt = 0; // when the player last asked the paddle to go somewhere new
let ackT = 0, rttMs = 0;      // newest snapshot's server time, and the round trip the server measured
let scale = 1, ox = 0, oy = 0, dpr = 1, uiKey = null;
let sA = null, sB = null, su = 0; // interpolation pair, kept out of the render loop to avoid allocation
let sScore = '0  0', sSpec = 'spectators 0', roleLabel = 'watching', lastScore = -1, lastSpec = -1;
const CD = ['', '1', '2'];
const TAU = Math.PI * 2;

function note(t) { noteEl.textContent = t; clearTimeout(note.t); note.t = setTimeout(() => noteEl.textContent = '', 4000); }

/* ---------- landing ---------- */
if (!roomId) {
  uiEl.innerHTML = '<div class=box><b>PONG</b><br><button id=mk>Create room</button><br>' +
    '<input id=jid placeholder="room id"><button id=jn>Join</button></div>';
  mk.onclick = async () => {
    const r = await fetch('/room', { method: 'POST' });
    location.href = '/r/' + (await r.json()).id;
  };
  jn.onclick = () => { if (jid.value.trim()) location.href = '/r/' + jid.value.trim(); };
} else {
  chosen = !!sessionStorage.getItem('tok:' + roomId);
  reconnect();
}

/* ---------- net ---------- */
// The server says why it closed these; retrying would only repeat the same answer.
const DELIBERATE = [4001, 4002, 4003, 4004];
let attempt = 0, retryUntil = 0;

// Resume as whoever we were: the token puts a player back in their own slot, and a
// spectator (no token) just rejoins the room.
function reconnect() {
  const tok = sessionStorage.getItem('tok:' + roomId);
  connect(tok ? 'play' : 'watch', tok);
}

function box(msg, btn) { // btn: 'now' | 'soon' | undefined
  uiKey = 'gone';
  uiEl.innerHTML = '<div class=box>' + msg +
    (btn ? '<br><button id=rc' + (btn === 'soon' ? ' disabled' : '') + '>Reconnect</button>' : '') + '</div>';
  const b = uiEl.querySelector('#rc');
  if (!b) return;
  b.onclick = () => location.reload();
  if (btn === 'soon') setTimeout(() => { b.disabled = false; }, 8000); // a new instance needs a moment
}

function connect(r, token) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws?room=${encodeURIComponent(roomId)}&role=${r}` +
    (token ? '&token=' + encodeURIComponent(token) : ''));
  ws = sock;
  let farewell = null; // the server's reason, for when a proxy eats the close code and leaves 1006
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') {
      Object.assign(V, m.dims); setRole(m.role, m.token); resize();
      attempt = 0; retryUntil = 0;
      if (uiKey === 'gone') { uiKey = null; uiEl.innerHTML = ''; } // clear "reconnecting…"
    }
    else if (m.type === 'role') { setRole(m.role, m.token); note('you are now player ' + m.role.toUpperCase()); }
    else if (m.type === 'lag') rttMs = m.ms;
    else if (m.type === 'bye') { farewell = m; sock.close(); }
    else if (m.type === 'state') {
      ackT = m.t;
      buf.push({ t: performance.now(), s: m });
      if (buf.length > 12) buf.shift();
      if (role) reconcile(m.paddles[role]);
      ui(m);
    }
  };
  sock.onclose = e => {
    const code = farewell ? farewell.code : e.code;
    const reason = farewell ? farewell.reason : e.reason;
    role = null; roleLabel = 'watching';
    if (code === 4001) { // someone else holds the paddle now: fall back to watching
      sessionStorage.removeItem('tok:' + roomId);
      note(reason + ' — watching instead');
      chosen = true; uiKey = null;
      return connect('watch');
    }
    if (code === 4004) return box('server restarting — reconnect in a moment', 'soon');
    if (DELIBERATE.includes(code)) return box('disconnected' + (reason ? ' — ' + reason : ''), 'now');
    // Unexpected drop (mobile handover, wifi blip): retry with backoff for ~30 s.
    if (!retryUntil) retryUntil = Date.now() + 30e3;
    if (Date.now() >= retryUntil) return box('could not reconnect', 'now');
    const wait = Math.round(Math.min(250 * 2 ** attempt, 5000) * (0.8 + Math.random() * 0.4));
    attempt++;
    box('reconnecting… (attempt ' + attempt + ')');
    setTimeout(reconnect, wait);
  };
}

// A snapshot describes the paddle as it was a round trip ago, so while the player is still moving
// it, being ahead of the server by speed x latency is correct prediction, not error. Nudging the
// rendered paddle toward that stale sample is what made a glide stutter.
//
// Nor can the position be corrected here: the paddle's position is a pure function of a target
// this client owns, so the next frame's prediction would pull any nudge straight back. A real
// disagreement means the server is working from an older target — an input lost with a dying
// socket, say — so the fix is to re-state intent and let the server's own simulation close the gap.
let resentAt = 0;
function reconcile(serverY) {
  const now = performance.now();
  if (Math.abs(tgt - myY) > 0.5 || now - tgtAt < 150) return;  // still gliding: not settled yet
  if (Math.abs(serverY - tgt) < 2 || now - resentAt < 500) return;
  sentY = null; resentAt = now; // frame() re-sends tgt; harmless if the server was merely catching up
}

function setRole(r, token) {
  role = r;
  roleLabel = r ? 'you: player ' + r.toUpperCase() : 'watching';
  if (token) sessionStorage.setItem('tok:' + roomId, token);
  if (r && buf.length) myY = tgt = buf[buf.length - 1].s.paddles[r];
  sentY = null; uiKey = null;
}

/* ---------- overlay (only touched when its state changes) ---------- */
function ui(s) {
  let key, html;
  if (!role && !chosen && s.open) {
    key = 'choice';
    html = '<div class=box>a paddle is free<br><button id=bp>Play</button><button id=bw>Watch</button>' +
      '<div class=link>' + location.href + '</div></div>';
  } else if (s.status === 'over') {
    key = 'over' + s.winner + s.score.a + s.score.b;
    html = '<div class=box>' + (s.winner === 'a' ? 'LEFT' : 'RIGHT') + ' WINS ' + s.score.a + '–' + s.score.b +
      (role ? '<br><button id=br>Rematch</button>' : '<br>waiting for a rematch…') + '</div>';
  } else if (!role && s.open) {
    key = 'claim';
    html = '<div class=box>a paddle is empty<br><button id=bc>Take the empty paddle</button></div>';
  } else if (s.status === 'wait') {
    key = 'wait';
    html = '<div class=box>waiting for an opponent…<div class=link>' + location.href + '</div></div>';
  } else if (s.status === 'paused') {
    key = 'paused';
    html = '<div class=box>opponent disconnected…<br>slot reserved 30s, then anyone watching can take it</div>';
  } else { key = 'none'; html = ''; }

  if (key === uiKey) return;
  uiKey = key; uiEl.innerHTML = html;
  const $ = id => uiEl.querySelector('#' + id);
  if ($('bp')) $('bp').onclick = () => { chosen = true; uiKey = null; ws.onclose = null; ws.close(); connect('play'); };
  if ($('bw')) $('bw').onclick = () => { chosen = true; uiKey = null; uiEl.innerHTML = ''; };
  if ($('bc')) $('bc').onclick = () => ws.send('{"type":"claim"}');
  if ($('br')) $('br').onclick = () => ws.send('{"type":"rematch"}');
}

/* ---------- input (players only) ---------- */
const keys = Object.create(null);
const toY = cy => clamp((cy * dpr - oy) / scale, V.PH / 2, V.H - V.PH / 2);
addEventListener('mousemove', e => { if (role) tgt = toY(e.clientY); });
addEventListener('touchmove', e => { if (role) { tgt = toY(e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
addEventListener('keydown', e => { keys[e.key] = 1; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key] = 0; });
addEventListener('resize', resize);

function resize() {
  dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / V.W, cv.height / V.H);       // letterbox, never simulate in pixels
  ox = (cv.width - V.W * scale) / 2; oy = (cv.height - V.H * scale) / 2;
}
resize();

/* ---------- render ---------- */
function sample(now) {
  const rt = now - BUFFER;
  let i = buf.length - 1;
  while (i > 0 && buf[i].t > rt) i--;
  sA = buf[i].s; sB = buf[i + 1] ? buf[i + 1].s : buf[i].s;
  su = buf[i + 1] ? clamp((rt - buf[i].t) / (buf[i + 1].t - buf[i].t || 1), 0, 1) : 0;
}

let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;

  if (role) { // local prediction of my own paddle
    const k = (keys.ArrowUp || keys.w || keys.W ? -1 : 0) + (keys.ArrowDown || keys.s || keys.S ? 1 : 0);
    if (k) tgt = clamp(tgt + k * V.SPEED * dt, V.PH / 2, V.H - V.PH / 2);
    if (tgt !== lastTgt) { lastTgt = tgt; tgtAt = now; } // mouse, touch and keys all land here
    myY += clamp(tgt - myY, -V.SPEED * dt, V.SPEED * dt);
    if (tgt !== sentY && now - sentAt >= 16 && ws.readyState === 1) { // capped at ~60 msg/s
      ws.send('{"type":"input","y":' + tgt.toFixed(1) + ',"ack":' + ackT + '}');
      sentY = tgt; sentAt = now;
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!buf.length) return;
  sample(now);
  const s = buf[buf.length - 1].s;

  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = '#222';
  for (let y = 6; y < V.H; y += 26) ctx.fillRect(V.W / 2 - 1, y, 2, 14);
  ctx.fillStyle = '#fff';
  ctx.fillRect(V.AX, (role === 'a' ? myY : lerp(sA.paddles.a, sB.paddles.a, su)) - V.PH / 2, V.PW, V.PH);
  ctx.fillRect(V.BX, (role === 'b' ? myY : lerp(sA.paddles.b, sB.paddles.b, su)) - V.PH / 2, V.PW, V.PH);
  if (s.status !== 'over') {
    // Paddles are interpolated from the past, but the ball must not be: between bounces it flies
    // in a straight line, so where it is *now* follows exactly from the newest snapshot. Drawing
    // it in the past let the server award points while the ball still looked a tenth of the field
    // short of the paddle — the player saw a shot they could still reach, and lost it anyway.
    let bx = s.ball.x, by = s.ball.y;
    if (s.status === 'play') {
      const age = Math.min((now - buf[buf.length - 1].t + rttMs / 2) / 1000, 0.25);
      bx += s.ball.vx * age;
      by += s.ball.vy * age;
      if (by < V.R) by = 2 * V.R - by;                        // walls bounce predictably
      else if (by > V.H - V.R) by = 2 * (V.H - V.R) - by;
      // Contact is the server's call, so never run the ball past a paddle ahead of the verdict.
      const fa = V.AX + V.PW + V.R, fb = V.BX - V.R;
      if (s.ball.x >= fa && bx < fa) bx = fa;
      if (s.ball.x <= fb && bx > fb) bx = fb;
    }
    ctx.beginPath();
    ctx.arc(bx, by, V.R, 0, TAU);   // R is the server's collision radius, so this is the real shape
    ctx.fill();
  }

  if (s.score.a * 100 + s.score.b !== lastScore) {
    lastScore = s.score.a * 100 + s.score.b; sScore = s.score.a + '  ' + s.score.b;
  }
  ctx.font = 'bold 44px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText(sScore, V.W / 2, 52);
  if (s.status === 'count') ctx.fillText(CD[Math.ceil(s.cd)] || '', V.W / 2, V.H / 2 + 16);

  if (s.spectators !== lastSpec) { lastSpec = s.spectators; sSpec = 'spectators ' + s.spectators; }
  ctx.font = '14px ui-monospace, monospace'; ctx.textAlign = 'left';
  ctx.fillText(sSpec, 8, V.H - 10);
  ctx.textAlign = 'right';
  ctx.fillText(roleLabel, V.W - 8, V.H - 10);
}
requestAnimationFrame(frame);
</script>
