name: deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm test
      - name: Client net math
        run: npm run test:predict
      - name: Degraded-network system test
        # boots its own server and impairment proxy, so it needs nothing set up around it
        run: npm run test:impaired
      - name: Smoke test against a local server
        # no env overrides: the smoke test asks POST /room for its own short timings, so this
        # runs exactly the same path as the live deployment
        run: |
          set -euo pipefail
          node server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:8080
          kill "$(cat server.pid)"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Cancelling mid-rollout would leave the service in a state this workflow cannot reason about.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      API: https://api.render.com/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Record the currently live deploy (rollback target)
        id: prev
        run: |
          set -euo pipefail
          prev=$(curl -sS -f -H "Authorization: Bearer $RENDER_API_KEY" \
            "$API/services/$SERVICE_ID/deploys?limit=20" \
            | jq -r '[.[].deploy | select(.status == "live")] | .[0].id // ""')
          echo "rollback target: ${prev:-none (first deploy)}"
          echo "id=$prev" >> "$GITHUB_OUTPUT"

      - name: Deploy this commit
        id: trigger
        run: |
          set -euo pipefail
          # the specific SHA, not "latest on branch": a push landing mid-run must not ship untested code
          deploy=$(curl -sS -f -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"commitId\": \"$GITHUB_SHA\", \"clearCache\": \"do_not_clear\"}" \
            "$API/services/$SERVICE_ID/deploys" | jq -r '.id // ""')
          if [ -z "$deploy" ]; then echo "no deploy id in the response"; exit 1; fi
          echo "deploy $deploy for $GITHUB_SHA"
          echo "id=$deploy" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to go live
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(curl -sS -f -H "Authorization: Bearer $RENDER_API_KEY" \
              "$API/services/$SERVICE_ID/deploys/${{ steps.trigger.outputs.id }}" | jq -r '.status')
            echo "deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled) echo "deploy failed: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out after 10 minutes waiting for the deploy to go live"
          exit 1

      - name: Wait for /health to report this commit
        run: |
          set -uo pipefail
          # A failure here rolls the deploy back, so record enough to tell an infrastructure
          # problem from a code problem: "unreachable" and "wrong version" are not the same fault.
          state=unreachable
          seen=""
          for i in $(seq 1 20); do
            # the first request pays the ~60s wake-up of a free instance with no traffic
            if [ "$i" = 1 ]; then t=90; else t=20; fi
            if body=$(curl -sS --max-time "$t" "$APP_URL/health"); then
              seen=$(printf '%s' "$body" | jq -r '.version // "<no version field>"')
              state=served
              echo "live version: $seen"
              if [ "$seen" = "$GITHUB_SHA" ]; then exit 0; fi
            else
              state=unreachable
              seen=""
              echo "/health did not respond"
            fi
            sleep 5
          done
          echo "::error::/health never reported $GITHUB_SHA"
          if [ "$state" = unreachable ]; then
            echo "Last observed: no response from $APP_URL/health."
            echo "The service is down or asleep. This is an infrastructure fault, not the pushed code."
          elif [ "$seen" = dev ]; then
            echo "Last observed: version=\"dev\"."
            echo "RENDER_GIT_COMMIT is not populated in the service environment, so this gate can never"
            echo "pass no matter how long it polls. The deployed code is probably fine — fix the service"
            echo "environment (or the health handler), not the app."
          else
            echo "Last observed: version=\"$seen\", expected \"$GITHUB_SHA\"."
            echo "A different valid build is still serving traffic: the rollout is slower than this poll"
            echo "window. Re-running the job may simply succeed."
          fi
          exit 1

      - name: Smoke test the live deployment
        run: |
          set -uo pipefail
          if node scripts/smoke.mjs "$APP_URL"; then exit 0; fi
          echo "::error::live smoke failed"
          echo "--- $APP_URL/health right after the failure:"
          curl -sS --max-time 30 "$APP_URL/health" || echo "(unreachable)"
          echo
          echo "If the version above is not $GITHUB_SHA, an older process is serving traffic and this is"
          echo "a rollout fault, not game logic. If it matches, the assertion above is a real failure."
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          set -euo pipefail
          prev='${{ steps.prev.outputs.id }}'
          if [ -z "$prev" ]; then
            echo "no rollback target was recorded (first deploy, or the lookup itself failed):"
            echo "nothing to roll back to, and the broken version is live."
            exit 1
          fi
          # rollback reuses the old build artifact instead of rebuilding, so recovery does not
          # reintroduce build-time risk during an incident
          curl -sS -f -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"deployId\": \"$prev\"}" "$API/services/$SERVICE_ID/rollback" > /dev/null
          echo "rolled back to $prev"
          exit 1
