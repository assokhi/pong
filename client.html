<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; touch-action: none; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .box { background: #000d; border: 1px solid #fff; padding: 20px 26px; text-align: center;
    pointer-events: auto; line-height: 1.9; max-width: 90vw; }
  button, input { font: inherit; margin: 4px; padding: 8px 14px; border: 1px solid #fff; }
  button { background: #fff; color: #000; cursor: pointer; }
  input { background: #000; color: #fff; width: 9em; }
  #note { position: fixed; top: 8px; left: 0; right: 0; text-align: center; opacity: .8; }
  .link { user-select: all; opacity: .7; font-size: 12px; word-break: break-all; }
</style>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="note"></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), uiEl = document.getElementById('ui');
const noteEl = document.getElementById('note');
const roomId = location.pathname.startsWith('/r/') ? location.pathname.slice(3) : '';
/*<net>*/
// ponytail: fenced so scripts/predict.test.mjs can lift this block out and run it under node:vm.
// Nothing in here may touch the DOM or the network. Upgrade path if the fence ever chafes: make
// it a served module and import it.
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const V = { W: 800, H: 450, R: 7, PW: 12, PH: 80, AX: 24, BX: 764, SPEED: 700, WIN: 11 };
let BUFFER = 100;                  // ms of interpolation delay
let buf = [], off = null, rttMs = 0;
let offs = [], offTarget = null, rttTarget = 0, rttSeen = false;
let sA = null, sB = null, su = 0;  // interpolation pair, kept out of the render loop to avoid allocation
let ballX = 0, ballY = 0;          // likewise: ballAt() writes here rather than returning a point
let jitterPx = -1;                 // smoothness of the drawn ball this frame; -1 when not measurable
let ballAge = 0;                   // seconds of extrapolation behind the drawn ball
const OFFW = 64;                   // ~2.5 s of snapshots in the offset window
const SLEW = 15;                   // ms of clock correction per second of wall time

// Snapshots play back on the SERVER's clock, never on arrival time. A lost segment stalls every
// snapshot queued behind it — this is TCP, so nothing is dropped, it is delayed — and then five
// arrive in the same millisecond. Keyed off arrival, that burst gave five frames near-identical
// timestamps, sample() walked back to the oldest frame still buffered, and the opponent's paddle
// crawled and then lurched: 164 ms of game time in a single frame, against 10 ms once the same
// fixture is played on m.t (scripts/predict.test.mjs measures exactly this). m.t stays 40 ms
// apart however the bytes actually turned up.
//
// The offset is the minimum of (local - server) over a sliding window: the least-delayed sample in
// recent memory is the one that spent the least time in transit, so it is the closest look at the
// true offset. A window rather than an all-time minimum, because an all-time minimum is pinned
// forever by one anomalously fast early packet and can never recover if the server's clock moves.
function trackClock(serverT, localNow) {
  offs.push(localNow - serverT);
  if (offs.length > OFFW) offs.shift();
  let m = Infinity;
  for (const v of offs) if (v < m) m = v;
  offTarget = m;
  if (off === null) off = m;   // cold start: adopt it, there is nothing yet to be smooth against
}

// Both the offset and the round trip are revisions to where the whole extrapolated world sits, so
// applying one as a step teleports the ball: at 900px/s a 40ms revision moves it 18px in a single
// frame. Bleed them in instead. 15ms/s costs a 1.5% velocity error no eye can catch and still
// closes a 100ms correction in under seven seconds. The first measurement of each is adopted
// outright — there is nothing to be smooth relative to yet, and starting 5s behind is worse.
function slew(dtMs) {
  const d = Math.min(dtMs, 100) * SLEW / 1000;
  if (offTarget !== null) off += clamp(offTarget - off, -d, d);
  rttMs += clamp(rttTarget - rttMs, -d * 2, d * 2);
}

function setRtt(ms) {
  rttTarget = ms;
  if (!rttSeen) { rttSeen = true; rttMs = ms; }
}

function pushSnap(m, localNow) {
  trackClock(m.t, localNow);
  buf.push(m);
  if (buf.length > 12) buf.shift();
}

function sample(now) {
  const rt = now - BUFFER;
  let i = buf.length - 1;
  while (i > 0 && buf[i].t + off > rt) i--;
  sA = buf[i]; sB = buf[i + 1] || buf[i];
  su = buf[i + 1] ? clamp((rt - (buf[i].t + off)) / (buf[i + 1].t - buf[i].t || 1), 0, 1) : 0;
}

// Paddles are interpolated from the past, but the ball must not be: between bounces it flies in a
// straight line, so where it is *now* follows exactly from the newest snapshot. Drawing it in the
// past let the server award points while the ball still looked a tenth of the field short of the
// paddle — the player saw a shot they could still reach, and lost it anyway.
//
// off already absorbs the baseline one-way delay, so rttMs/2 is what remains to carry the ball
// from "when this snapshot would have arrived" to "where it is now". The two terms are
// complementary, not two spellings of the same correction.
let pBX = 0, pBY = 0, pVX = 0, pVY = 0, pNow = 0, pClean = false;
function ballAt(s, now) {
  ballX = s.ball.x; ballY = s.ball.y;
  if (s.status !== 'play') { pClean = false; jitterPx = -1; return; }
  // Two different quantities, and only one of them is a risk. rtt/2 is a standing, measured
  // correction that is always right to apply. Staleness — how long since this snapshot should have
  // reached us — is the one that runs away when a connection dies, so it is the one that gets
  // capped. Capping their sum instead pins the ball at the ceiling for the whole of a 300ms+ link:
  // the extrapolation stops responding to time and the ball advances only when a snapshot lands,
  // stepping ~16px at 21Hz. That looks exactly like the jitter the cap was supposed to prevent.
  const stale = (now - (s.t + off)) / 1000;
  const held = Math.min(stale, 0.25);
  const age = ballAge = held + rttMs / 2000;
  ballX += s.ball.vx * age;
  ballY += s.ball.vy * age;
  let clean = stale === held;                         // a capped ball is frozen, not smooth
  if (ballY < V.R) { ballY = 2 * V.R - ballY; clean = false; }             // walls bounce predictably
  else if (ballY > V.H - V.R) { ballY = 2 * (V.H - V.R) - ballY; clean = false; }
  // Contact is the server's call, so never run the ball past a paddle ahead of the verdict.
  const fa = V.AX + V.PW + V.R, fb = V.BX - V.R;
  if (s.ball.x >= fa && ballX < fa) { ballX = fa; clean = false; }
  if (s.ball.x <= fb && ballX > fb) { ballX = fb; clean = false; }

  // Smoothness, measured where the word means something. In free flight the drawn ball must
  // advance by exactly velocity x frame time; any other distance is the extrapolation
  // contradicting itself between two frames, which is precisely what a player calls jitter.
  // Bounces, face clamps and capped ages are excluded — those are known discontinuities, not
  // defects, and counting them would bury the signal this number exists to carry.
  jitterPx = (clean && pClean && pVX === s.ball.vx && pVY === s.ball.vy)
    ? Math.hypot(ballX - pBX - s.ball.vx * (now - pNow) / 1000,
                 ballY - pBY - s.ball.vy * (now - pNow) / 1000)
    : -1;
  pBX = ballX; pBY = ballY; pVX = s.ball.vx; pVY = s.ball.vy; pNow = now; pClean = clean;
}
/*</net>*/

// Hand-testing knobs: ?buffer=250 widens the jitter cushion, ?rtt=200 pins the extrapolation
// distance so you can see what a given latency looks like without actually having it.
const qs = new URLSearchParams(location.search);
let rttPin = false;
if (qs.has('buffer')) BUFFER = Math.max(0, +qs.get('buffer') || 0);
if (qs.has('rtt')) { rttMs = rttTarget = Math.max(0, +qs.get('rtt') || 0); rttSeen = rttPin = true; }

let ws = null, role = null, chosen = false, welcomed = false, myY = V.H / 2, tgt = V.H / 2;
let sentY = null, sentAt = 0;
let lastTgt = null, tgtAt = 0; // when the player last asked the paddle to go somewhere new
let scale = 1, ox = 0, oy = 0, dpr = 1, uiKey = null;
let sScore = '0  0', sSpec = 'spectators 0', roleLabel = 'watching', lastScore = -1, lastSpec = -1;
const CD = ['', '1', '2'];
const TAU = Math.PI * 2;

function note(t) { noteEl.textContent = t; clearTimeout(note.t); note.t = setTimeout(() => noteEl.textContent = '', 4000); }

/* ---------- beta telemetry ---------- */
// What a player means by "the ball is jittery" is not a feeling the logs can hold, so the client
// measures it: jitMed/jitP95/jitMax are how far the drawn ball departed from velocity x frame time
// in free flight, in virtual px. On a correct stream that is ~0 whatever the network is doing, so a
// non-zero value is a real defect and the network numbers beside it say which one.
const CAP = 3000;                       // bound the sample arrays if a send ever fails to fire
let tele = null;
function resetTele() {
  tele = { t0: performance.now(), snaps: 0, reconnects: tele ? tele.reconnects : 0,
           gaps: [], jit: [], frames: 0, underruns: 0, clamped: 0, stalls: 0, ageMax: 0, lastAt: 0 };
}
resetTele();

const quant = (a, p) => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return +s[Math.min(s.length - 1, Math.floor(s.length * p))].toFixed(2);
};

function sendTele(text) {
  if (!ws || ws.readyState !== 1) return;
  const ms = Math.max(1, performance.now() - tele.t0);
  ws.send(JSON.stringify({
    type: 'telemetry',
    ms: Math.round(ms),
    net: {
      rtt: Math.round(rttMs), snaps: tele.snaps, reconnects: tele.reconnects, stalls: tele.stalls,
      gapMed: quant(tele.gaps, 0.5), gapP95: quant(tele.gaps, 0.95), gapMax: quant(tele.gaps, 1),
    },
    render: {
      fps: Math.round(tele.frames / (ms / 1000)), samples: tele.jit.length,
      jitMed: quant(tele.jit, 0.5), jitP95: quant(tele.jit, 0.95), jitMax: quant(tele.jit, 1),
      underruns: tele.underruns, clamped: tele.clamped, ageMax: Math.round(tele.ageMax * 1000),
    },
    view: { w: innerWidth, h: innerHeight, dpr: +dpr.toFixed(2) },
    note: text || undefined,
  }));
  resetTele();
}
setInterval(() => { if (tele.frames) sendTele(); }, 15000);

/* ---------- landing ---------- */
if (!roomId) {
  uiEl.innerHTML = '<div class=box><b>PONG</b><br><button id=mk>Create room</button><br>' +
    '<input id=jid placeholder="room id"><button id=jn>Join</button></div>';
  mk.onclick = async () => {
    const r = await fetch('/room', { method: 'POST' });
    location.href = '/r/' + (await r.json()).id;
  };
  jn.onclick = () => { if (jid.value.trim()) location.href = '/r/' + jid.value.trim(); };
} else {
  chosen = !!sessionStorage.getItem('tok:' + roomId);
  reconnect();
}

/* ---------- net ---------- */
// The server says why it closed these; retrying would only repeat the same answer.
const DELIBERATE = [4001, 4002, 4003, 4004];
let attempt = 0, retryUntil = 0;

// Resume as whoever we were: the token puts a player back in their own slot, and a
// spectator (no token) just rejoins the room.
function reconnect() {
  const tok = sessionStorage.getItem('tok:' + roomId);
  connect(tok ? 'play' : 'watch', tok);
}

function box(msg, btn) { // btn: 'now' | 'soon' | undefined
  uiKey = 'gone';
  uiEl.innerHTML = '<div class=box>' + msg +
    (btn ? '<br><button id=rc' + (btn === 'soon' ? ' disabled' : '') + '>Reconnect</button>' : '') + '</div>';
  const b = uiEl.querySelector('#rc');
  if (!b) return;
  b.onclick = () => location.reload();
  if (btn === 'soon') setTimeout(() => { b.disabled = false; }, 8000); // a new instance needs a moment
}

function connect(r, token) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws?room=${encodeURIComponent(roomId)}&role=${r}` +
    (token ? '&token=' + encodeURIComponent(token) : ''));
  ws = sock;
  let farewell = null; // the server's reason, for when a proxy eats the close code and leaves 1006
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') {
      Object.assign(V, m.dims); setRole(m.role, m.token); resize();
      attempt = 0; retryUntil = 0;
      if (!welcomed) { welcomed = true; note('press F if anything feels wrong'); }
      if (uiKey === 'gone') { uiKey = null; uiEl.innerHTML = ''; } // clear "reconnecting…"
    }
    else if (m.type === 'role') { setRole(m.role, m.token); note('you are now player ' + m.role.toUpperCase()); }
    else if (m.type === 'lag') { if (!rttPin) setRtt(m.ms); }
    else if (m.type === 'bye') { farewell = m; sock.close(); }
    else if (m.type === 'state') {
      const at = performance.now();
      if (tele.lastAt) {
        const gap = at - tele.lastAt;
        if (tele.gaps.length < CAP) tele.gaps.push(gap);
        if (gap > 200) tele.stalls++;      // a retransmit-sized hole in an otherwise 40ms stream
      }
      tele.lastAt = at; tele.snaps++;
      pushSnap(m, at);
      if (role) reconcile(m.paddles[role]);
      ui(m);
    }
  };
  sock.onclose = e => {
    const code = farewell ? farewell.code : e.code;
    const reason = farewell ? farewell.reason : e.reason;
    role = null; roleLabel = 'watching';
    if (code === 4001) { // someone else holds the paddle now: fall back to watching
      sessionStorage.removeItem('tok:' + roomId);
      note(reason + ' — watching instead');
      chosen = true; uiKey = null;
      return connect('watch');
    }
    if (code === 4004) return box('server restarting — reconnect in a moment', 'soon');
    if (DELIBERATE.includes(code)) return box('disconnected' + (reason ? ' — ' + reason : ''), 'now');
    // Unexpected drop (mobile handover, wifi blip): retry with backoff for ~30 s.
    tele.reconnects++;
    if (!retryUntil) retryUntil = Date.now() + 30e3;
    if (Date.now() >= retryUntil) return box('could not reconnect', 'now');
    const wait = Math.round(Math.min(250 * 2 ** attempt, 5000) * (0.8 + Math.random() * 0.4));
    attempt++;
    box('reconnecting… (attempt ' + attempt + ')');
    setTimeout(reconnect, wait);
  };
}

// A snapshot describes the paddle as it was a round trip ago, so while the player is still moving
// it, being ahead of the server by speed x latency is correct prediction, not error. Nudging the
// rendered paddle toward that stale sample is what made a glide stutter.
//
// Nor can the position be corrected here: the paddle's position is a pure function of a target
// this client owns, so the next frame's prediction would pull any nudge straight back. A real
// disagreement means the server is working from an older target — an input lost with a dying
// socket, say — so the fix is to re-state intent and let the server's own simulation close the gap.
let resentAt = 0;
function reconcile(serverY) {
  const now = performance.now();
  if (Math.abs(tgt - myY) > 0.5 || now - tgtAt < 150) return;  // still gliding: not settled yet
  if (Math.abs(serverY - tgt) < 2 || now - resentAt < 500) return;
  sentY = null; resentAt = now; // frame() re-sends tgt; harmless if the server was merely catching up
}

function setRole(r, token) {
  role = r;
  roleLabel = r ? 'you: player ' + r.toUpperCase() : 'watching';
  if (token) sessionStorage.setItem('tok:' + roomId, token);
  if (r && buf.length) myY = tgt = buf[buf.length - 1].paddles[r];
  sentY = null; uiKey = null;
}

/* ---------- overlay (only touched when its state changes) ---------- */
function ui(s) {
  let key, html;
  if (!role && !chosen && s.open) {
    key = 'choice';
    html = '<div class=box>a paddle is free<br><button id=bp>Play</button><button id=bw>Watch</button>' +
      '<div class=link>' + location.href + '</div></div>';
  } else if (s.status === 'over') {
    key = 'over' + s.winner + s.score.a + s.score.b;
    html = '<div class=box>' + (s.winner === 'a' ? 'LEFT' : 'RIGHT') + ' WINS ' + s.score.a + '–' + s.score.b +
      (role ? '<br><button id=br>Rematch</button>' : '<br>waiting for a rematch…') + '</div>';
  } else if (!role && s.open) {
    key = 'claim';
    html = '<div class=box>a paddle is empty<br><button id=bc>Take the empty paddle</button></div>';
  } else if (s.status === 'wait') {
    key = 'wait';
    html = '<div class=box>waiting for an opponent…<div class=link>' + location.href + '</div></div>';
  } else if (s.status === 'paused') {
    key = 'paused';
    html = '<div class=box>opponent disconnected…<br>slot reserved 30s, then anyone watching can take it</div>';
  } else { key = 'none'; html = ''; }

  if (key === uiKey) return;
  uiKey = key; uiEl.innerHTML = html;
  const $ = id => uiEl.querySelector('#' + id);
  if ($('bp')) $('bp').onclick = () => { chosen = true; uiKey = null; ws.onclose = null; ws.close(); connect('play'); };
  if ($('bw')) $('bw').onclick = () => { chosen = true; uiKey = null; uiEl.innerHTML = ''; };
  if ($('bc')) $('bc').onclick = () => ws.send('{"type":"claim"}');
  if ($('br')) $('br').onclick = () => ws.send('{"type":"rematch"}');
}

/* ---------- input (players only) ---------- */
const keys = Object.create(null);
const toY = cy => clamp((cy * dpr - oy) / scale, V.PH / 2, V.H - V.PH / 2);
addEventListener('mousemove', e => { if (role) tgt = toY(e.clientY); });
addEventListener('touchmove', e => { if (role) { tgt = toY(e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
addEventListener('keydown', e => {
  keys[e.key] = 1;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  // Beta feedback. The note travels with the session's own measurements, so a report arrives as
  // "felt laggy near the right paddle" *next to* the numbers for that minute, rather than alone.
  // ponytail: prompt() blocks the render loop for as long as it is open. Fine for a beta key,
  // replace with an in-page field if it ever ships to players who did not opt into one.
  if (e.key === 'f' || e.key === 'F') {
    const text = prompt('What went wrong? Sent with this session\'s network and smoothness metrics.');
    if (text && text.trim()) { sendTele(text.trim().slice(0, 500)); note('sent — thank you'); }
  }
});
addEventListener('keyup', e => { keys[e.key] = 0; });
addEventListener('resize', resize);

function resize() {
  dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / V.W, cv.height / V.H);       // letterbox, never simulate in pixels
  ox = (cv.width - V.W * scale) / 2; oy = (cv.height - V.H * scale) / 2;
}
resize();

/* ---------- render ---------- */
let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  slew(dt * 1000);

  if (role) { // local prediction of my own paddle
    const k = (keys.ArrowUp || keys.w || keys.W ? -1 : 0) + (keys.ArrowDown || keys.s || keys.S ? 1 : 0);
    if (k) tgt = clamp(tgt + k * V.SPEED * dt, V.PH / 2, V.H - V.PH / 2);
    if (tgt !== lastTgt) { lastTgt = tgt; tgtAt = now; } // mouse, touch and keys all land here
    myY += clamp(tgt - myY, -V.SPEED * dt, V.SPEED * dt);
    if (tgt !== sentY && now - sentAt >= 16 && ws.readyState === 1) { // capped at ~60 msg/s
      ws.send('{"type":"input","y":' + tgt.toFixed(1) + '}');
      sentY = tgt; sentAt = now;
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!buf.length) return;
  sample(now);
  const s = buf[buf.length - 1];

  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = '#222';
  for (let y = 6; y < V.H; y += 26) ctx.fillRect(V.W / 2 - 1, y, 2, 14);
  ctx.fillStyle = '#fff';
  ctx.fillRect(V.AX, (role === 'a' ? myY : lerp(sA.paddles.a, sB.paddles.a, su)) - V.PH / 2, V.PW, V.PH);
  ctx.fillRect(V.BX, (role === 'b' ? myY : lerp(sA.paddles.b, sB.paddles.b, su)) - V.PH / 2, V.PW, V.PH);
  tele.frames++;
  if (sA === sB) tele.underruns++;   // the buffer ran dry: nothing left to interpolate toward

  if (s.status !== 'over') {
    ballAt(s, now);
    if (jitterPx >= 0) { if (tele.jit.length < CAP) tele.jit.push(jitterPx); }
    else tele.clamped++;
    if (ballAge > tele.ageMax) tele.ageMax = ballAge;
    ctx.beginPath();
    ctx.arc(ballX, ballY, V.R, 0, TAU); // R is the server's collision radius, so this is the real shape
    ctx.fill();
  }

  if (s.score.a * 100 + s.score.b !== lastScore) {
    lastScore = s.score.a * 100 + s.score.b; sScore = s.score.a + '  ' + s.score.b;
  }
  ctx.font = 'bold 44px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText(sScore, V.W / 2, 52);
  if (s.status === 'count') ctx.fillText(CD[Math.ceil(s.cd)] || '', V.W / 2, V.H / 2 + 16);

  if (s.spectators !== lastSpec) { lastSpec = s.spectators; sSpec = 'spectators ' + s.spectators; }
  ctx.font = '14px ui-monospace, monospace'; ctx.textAlign = 'left';
  ctx.fillText(sSpec, 8, V.H - 10);
  ctx.textAlign = 'right';
  ctx.fillText(roleLabel, V.W - 8, V.H - 10);
}
requestAnimationFrame(frame);
</script>
